name: Scheduled API Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  api-tests:
    name: Run API Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create necessary directories
      run: |
        mkdir -p uploads
        mkdir -p Test_Data
        mkdir -p test-results
        mkdir -p logs
    
    - name: Run single test (example)
      continue-on-error: true
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        echo "Running test case TC_001..."
        python run_single_test.py TC_001 Test_Data/FA-739.csv || true
    
    - name: Generate test report
      if: always()
      run: |
        echo "Test execution completed at $(date)"
        ls -la test-results/ || true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: api-test-results-${{ github.run_number }}
        path: |
          test-results/
          logs/
        retention-days: 30
    
    - name: Create test summary
      if: always()
      run: |
        echo "## 📊 API Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Test Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts for detailed test results." >> $GITHUB_STEP_SUMMARY

